<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Apartment: cozy living room in daylight with a large window, sofa, aquarium, cat and robot vacuum. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9cbb8"/>
      <stop offset="0.5" stop-color="#efe5d6"/>
      <stop offset="1" stop-color="#d6c7b2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a57a52"/>
      <stop offset="1" stop-color="#7a5536"/>
    </linearGradient>
    <pattern id="planks" width="240" height="40" patternUnits="userSpaceOnUse">
      <rect width="240" height="40" fill="none" stroke="#5e3f27" stroke-opacity="0.35" stroke-width="2"/>
      <line x1="120" y1="0" x2="120" y2="40" stroke="#5e3f27" stroke-opacity="0.25" stroke-width="2"/>
    </pattern>
    <linearGradient id="outsideSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ea2e0"/>
      <stop offset="1" stop-color="#d6ecf8"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6f8f"/>
      <stop offset="1" stop-color="#36506a"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd3e6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2a8aa8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6efe2"/>
      <stop offset="0.3" stop-color="#e3d8c4"/>
      <stop offset="0.6" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#dcd0ba"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Walls and floor -->
  <rect width="1920" height="780" fill="url(#wall)"/>
  <rect y="760" width="1920" height="20" fill="#f5f0e8"/>
  <rect y="780" width="1920" height="300" fill="url(#floor)"/>
  <rect y="780" width="1920" height="300" fill="url(#planks)"/>

  <!-- Large window with outside view (slightly blurred = depth of field) -->
  <g>
    <rect x="620" y="110" width="680" height="560" fill="url(#outsideSky)"/>
    <g filter="url(#blur)">
      <ellipse cx="780" cy="230" rx="110" ry="26" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="1150" cy="190" rx="90" ry="20" fill="#ffffff" opacity="0.8"/>
      <path d="M620 520 C 720 470, 820 500, 940 480 S 1160 460, 1300 500 L1300 670 L620 670 Z" fill="#7fa98a"/>
      <circle cx="700" cy="560" r="70" fill="#3f7a3c"/>
      <circle cx="780" cy="590" r="60" fill="#356a33"/>
      <circle cx="1200" cy="560" r="80" fill="#3a7036"/>
      <rect x="900" y="520" width="140" height="150" fill="#c9b8a4"/>
      <path d="M890 520 L970 470 L1050 520 Z" fill="#a0523d"/>
    </g>
    <path fill-rule="evenodd" fill="#f7f5f0" d="M600 90 H1320 V690 H600 Z M620 110 H1300 V670 H620 Z"/>
    <rect x="950" y="110" width="20" height="560" fill="#f7f5f0"/>
    <rect x="580" y="686" width="760" height="22" rx="4" fill="#fbfaf6"/>
  </g>

  <!-- Curtains -->
  <path d="M500 60 H640 C 630 300, 660 500, 610 760 H470 C 520 500, 490 300, 500 60 Z" fill="url(#curtain)"/>
  <path d="M1280 60 H1420 C 1430 300, 1400 500, 1450 760 H1310 C 1260 500, 1290 300, 1280 60 Z" fill="url(#curtain)"/>
  <rect x="460" y="50" width="1000" height="12" rx="6" fill="#8a7a66"/>

  <!-- Sunbeam on the floor -->
  <path d="M620 670 L1300 670 L1520 1080 L760 1080 Z" fill="url(#sunbeam)"/>

  <!-- Wall art -->
  <rect x="200" y="200" width="200" height="260" fill="#6b4a32"/>
  <rect x="215" y="215" width="170" height="230" fill="#f2e6cf"/>
  <circle cx="300" cy="300" r="50" fill="#e08a5a"/>
  <path d="M215 445 L280 360 L330 410 L385 340 V445 Z" fill="#5b8a6a"/>

  <!-- Aquarium on a cabinet -->
  <g transform="translate(1520 560)">
    <rect x="0" y="120" width="300" height="200" fill="#4a3324"/>
    <rect x="10" y="135" width="135" height="170" fill="#5a3f2c"/>
    <rect x="155" y="135" width="135" height="170" fill="#5a3f2c"/>
    <rect x="0" y="0" width="300" height="120" fill="url(#tank)" stroke="#2b2b2b" stroke-width="6"/>
    <rect x="3" y="98" width="294" height="20" fill="#d9c7a0"/>
    <path d="M40 98 C 30 70, 50 50, 40 20 M60 98 C 70 70, 55 45, 66 25 M250 98 C 240 60, 262 40, 250 15" stroke="#2f8a4a" stroke-width="6" fill="none"/>
    <g fill="#ff8a2a"><path d="M120 50 l20 -10 v20 z"/><ellipse cx="110" cy="50" rx="16" ry="9"/></g>
    <g fill="#ffd23a"><path d="M200 70 l-18 -8 v16 z"/><ellipse cx="212" cy="70" rx="13" ry="7"/></g>
    <g fill="#3ab0ff"><path d="M170 34 l14 -7 v14 z"/><ellipse cx="162" cy="34" rx="10" ry="6"/></g>
    <rect x="0" y="-10" width="300" height="12" fill="#2b2b2b"/>
  </g>

  <!-- Floor lamp -->
  <g transform="translate(170 780)">
    <rect x="-4" y="-420" width="8" height="420" fill="#2a2a2a"/>
    <ellipse cx="0" cy="0" rx="50" ry="10" fill="#2a2a2a"/>
    <path d="M-60 -420 L60 -420 L40 -500 L-40 -500 Z" fill="#f2e2c0"/>
  </g>

  <!-- Rug -->
  <ellipse cx="900" cy="960" rx="560" ry="90" fill="#b5524a"/>
  <ellipse cx="900" cy="960" rx="500" ry="70" fill="none" stroke="#e8c79a" stroke-width="6"/>

  <!-- Sofa -->
  <ellipse cx="760" cy="900" rx="380" ry="30" fill="url(#shadow)"/>
  <g>
    <rect x="420" y="700" width="680" height="120" rx="30" fill="url(#sofa)"/>
    <rect x="400" y="780" width="720" height="110" rx="24" fill="#425f7c"/>
    <rect x="470" y="770" width="290" height="40" rx="16" fill="#5a7c9c"/>
    <rect x="760" y="770" width="290" height="40" rx="16" fill="#5a7c9c"/>
    <rect x="380" y="730" width="70" height="160" rx="28" fill="#3e5a76"/>
    <rect x="1070" y="730" width="70" height="160" rx="28" fill="#3e5a76"/>
    <rect x="420" y="888" width="14" height="22" fill="#2b2b2b"/>
    <rect x="1086" y="888" width="14" height="22" fill="#2b2b2b"/>
    <rect x="490" y="720" width="90" height="70" rx="18" fill="#e3b34a" transform="rotate(-8 535 755)"/>
  </g>

  <!-- Cat sleeping on the sofa -->
  <g transform="translate(900 770)">
    <ellipse cx="0" cy="0" rx="70" ry="34" fill="#e08a3c"/>
    <circle cx="58" cy="-10" r="26" fill="#e08a3c"/>
    <path d="M44 -30 L50 -52 L62 -32 Z M64 -32 L78 -48 L80 -24 Z" fill="#e08a3c"/>
    <path d="M50 -10 q6 4 12 0 M66 -10 q6 4 12 0" stroke="#5a2d10" stroke-width="2.5" fill="none"/>
    <path d="M-68 4 C -100 10, -90 36, -40 30" stroke="#e08a3c" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g stroke="#b8642a" stroke-width="5" opacity="0.7"><path d="M-30 -30 q6 14 0 28"/><path d="M-5 -33 q6 14 0 30"/><path d="M20 -30 q6 14 0 26"/></g>
  </g>

  <!-- Coffee table -->
  <ellipse cx="900" cy="1010" rx="220" ry="22" fill="url(#shadow)"/>
  <rect x="700" y="940" width="400" height="22" rx="8" fill="#c79a6a"/>
  <rect x="730" y="962" width="14" height="50" fill="#8a6440"/>
  <rect x="1056" y="962" width="14" height="50" fill="#8a6440"/>
  <rect x="820" y="912" width="40" height="30" rx="4" fill="#fdfdfd"/>
  <path d="M860 920 q14 6 0 16" stroke="#fdfdfd" stroke-width="5" fill="none"/>

  <!-- Potted plant -->
  <g transform="translate(1380 900)">
    <path d="M-50 0 L50 0 L40 90 L-40 90 Z" fill="#c4683a"/>
    <g fill="#3a8a4a">
      <ellipse cx="-40" cy="-60" rx="20" ry="70" transform="rotate(-30 -40 -60)"/>
      <ellipse cx="40" cy="-60" rx="20" ry="70" transform="rotate(30 40 -60)"/>
      <ellipse cx="0" cy="-90" rx="22" ry="90"/>
      <ellipse cx="-20" cy="-40" rx="16" ry="50" transform="rotate(-60 -20 -40)" fill="#4fa55c"/>
      <ellipse cx="25" cy="-40" rx="16" ry="50" transform="rotate(60 25 -40)" fill="#4fa55c"/>
    </g>
  </g>

  <!-- Robot vacuum -->
  <g transform="translate(300 1010)">
    <ellipse cx="0" cy="18" rx="95" ry="16" fill="url(#shadow)"/>
    <ellipse cx="0" cy="0" rx="90" ry="26" fill="#2b2d33"/>
    <ellipse cx="0" cy="-8" rx="86" ry="22" fill="#3a3d45"/>
    <ellipse cx="0" cy="-12" rx="26" ry="8" fill="#1e2026"/>
    <circle cx="40" cy="-8" r="4" fill="#33e07a"/>
  </g>
</svg>
