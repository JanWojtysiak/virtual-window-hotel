services:
  app:
    build: .
    ports:
      - '5173:5173'
    volumes:
      # Source code is mounted live, so edits on the host show up instantly.
      - .:/app
      # Keep container's own node_modules (Linux binaries), not the host's.
      - node_modules:/app/node_modules
    environment:
      # File events don't cross Windows bind mounts – use polling instead.
      - VITE_USE_POLLING=true

volumes:
  node_modules:
